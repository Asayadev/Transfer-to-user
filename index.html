<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Style Calling App</title>
  <!-- FontAwesome Icons for Phone, Mic, Video Buttons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Mobile Screen Container */
    .phone-screen {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 750px;
      background: #1a1a1a;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #333;
    }

    /* Header & Call Status */
    .call-header {
      padding: 30px 20px;
      text-align: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }
    .call-status { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .room-display { font-size: 18px; font-weight: bold; color: #28a745; margin-top: 5px; }

    /* Video Container */
    .video-viewport {
      flex: 1;
      position: relative;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Remote Video (Full Screen) */
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Local Video (Floating Pip Screen) */
    #localVideo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 100px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #555;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 5;
    }

    /* Placeholder for Audio Call Mode */
    .avatar-placeholder {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .avatar-placeholder i { font-size: 80px; color: #555; margin-bottom: 10px; }

    /* Setup / Room Input Panel */
    .setup-panel {
      position: absolute;
      bottom: 110px;
      left: 20px;
      right: 20px;
      background: rgba(25, 25, 25, 0.95);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      border: 1px solid #333;
    }

    .mode-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 5px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      background: #333;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
    }
    .mode-btn.active { background: #007bff; color: #fff; border-color: #007bff; }

    input {
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .btn-action {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-create { background: #28a745; }
    .btn-join { background: #17a2b8; }

    /* Bottom Control Bar (Call Controls) */
    .controls-bar {
      height: 100px;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding-bottom: 10px;
      z-index: 10;
    }

    .icon-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      background: #333;
      color: white;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .icon-btn:hover { opacity: 0.8; }
    .icon-btn.off { background: #dc3545; }
    .icon-btn.end-call { background: #dc3545; width: 65px; height: 65px; font-size: 24px; }
  </style>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <div class="phone-screen">
    <!-- Header -->
    <div class="call-header">
      <div id="statusText" class="call-status">Ready to Call</div>
      <div id="roomIdText" class="room-display"></div>
    </div>

    <!-- Video Area -->
    <div class="video-viewport">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      
      <div id="avatarBox" class="avatar-placeholder">
        <i class="fa-solid fa-user-large"></i>
        <p>Voice Call</p>
      </div>
    </div>

    <!-- Setup Panel -->
    <div id="setupPanel" class="setup-panel">
      <div class="mode-selector">
        <button id="videoModeBtn" class="mode-btn active" onclick="setCallMode('video')">
          <i class="fa-solid fa-video"></i> Video Call
        </button>
        <button id="audioModeBtn" class="mode-btn" onclick="setCallMode('audio')">
          <i class="fa-solid fa-phone"></i> Audio Call
        </button>
      </div>

      <button class="btn-action btn-create" onclick="createCall()">Start New Call</button>
      <input type="text" id="callInput" placeholder="Enter Room ID to Join">
      <button class="btn-action btn-join" onclick="joinCall()">Join Call</button>
    </div>

    <!-- Bottom Controls -->
    <div class="controls-bar">
      <!-- Mute Mic Button -->
      <button id="micBtn" class="icon-btn" onclick="toggleMic()" disabled>
        <i class="fa-solid fa-microphone"></i>
      </button>

      <!-- End Call Button -->
      <button id="endBtn" class="icon-btn end-call" onclick="endCall()" disabled>
        <i class="fa-solid fa-phone-slash"></i>
      </button>

      <!-- Toggle Video Button -->
      <button id="camBtn" class="icon-btn" onclick="toggleCam()" disabled>
        <i class="fa-solid fa-video"></i>
      </button>
    </div>
  </div>

  <script>
    // Exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCiIx-PaKqrZJnrNCy_AzRuAreEWHwAEsY",
      authDomain: "video-call-app-v2.firebaseapp.com",
      projectId: "video-call-app-v2",
      storageBucket: "video-call-app-v2.firebasestorage.app",
      messagingSenderId: "218235608788",
      appId: "1:218235608788:web:0c525518e73edce88be541",
      measurementId: "G-JHYXE20WRB"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();

    const servers = {
      iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }],
      iceCandidatePoolSize: 10,
    };

    let pc = new RTCPeerConnection(servers);
    let localStream = null;
    let remoteStream = null;
    let isAudioOnly = false;

    // UI Elements
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusText = document.getElementById('statusText');
    const roomIdText = document.getElementById('roomIdText');
    const setupPanel = document.getElementById('setupPanel');
    const avatarBox = document.getElementById('avatarBox');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    const endBtn = document.getElementById('endBtn');

    // Call Mode Selector (Audio vs Video)
    function setCallMode(mode) {
      if(mode === 'audio') {
        isAudioOnly = true;
        document.getElementById('audioModeBtn').classList.add('active');
        document.getElementById('videoModeBtn').classList.remove('active');
      } else {
        isAudioOnly = false;
        document.getElementById('videoModeBtn').classList.add('active');
        document.getElementById('audioModeBtn').classList.remove('active');
      }
    }

    // Media Access Initialization
    async function initMedia() {
      const constraints = {
        audio: true,
        video: isAudioOnly ? false : true
      };

      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      remoteStream = new MediaStream();

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = event => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
      };

      if (!isAudioOnly) {
        localVideo.srcObject = localStream;
        remoteVideo.srcObject = remoteStream;
      } else {
        avatarBox.style.display = 'flex';
        localVideo.style.display = 'none';
      }

      micBtn.disabled = false;
      camBtn.disabled = isAudioOnly; // Disable camera toggle in Audio mode
      endBtn.disabled = false;
    }

    // 1. Create Call
    async function createCall() {
      await initMedia();
      setupPanel.style.display = 'none';
      statusText.innerText = "Calling / Waiting for receiver...";

      const callDoc = firestore.collection('calls').doc();
      const offerCandidates = callDoc.collection('offerCandidates');
      const answerCandidates = callDoc.collection('answerCandidates');

      roomIdText.innerText = "Room ID: " + callDoc.id;

      pc.onicecandidate = event => {
        event.candidate && offerCandidates.add(event.candidate.toJSON());
      };

      const offerDescription = await pc.createOffer();
      await pc.setLocalDescription(offerDescription);

      await callDoc.set({ offer: { sdp: offerDescription.sdp, type: offerDescription.type } });

      callDoc.onSnapshot(snapshot => {
        const data = snapshot.data();
        if (!pc.currentRemoteDescription && data?.answer) {
          pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          statusText.innerText = "Connected";
        }
      });

      answerCandidates.onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') {
            pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });
    }

    // 2. Join Call
    async function joinCall() {
      const callId = document.getElementById('callInput').value.trim();
      if (!callId) return alert("Please enter Room ID");

      await initMedia();
      setupPanel.style.display = 'none';
      statusText.innerText = "Connecting...";

      const callDoc = firestore.collection('calls').doc(callId);
      const answerCandidates = callDoc.collection('answerCandidates');
      const offerCandidates = callDoc.collection('offerCandidates');

      pc.onicecandidate = event => {
        event.candidate && answerCandidates.add(event.candidate.toJSON());
      };

      const callData = (await callDoc.get()).data();
      if (!callData) return alert("Invalid Room ID");

      await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answerDescription = await pc.createAnswer();
      await pc.setLocalDescription(answerDescription);

      await callDoc.update({ answer: { type: answerDescription.type, sdp: answerDescription.sdp } });

      offerCandidates.onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') {
            pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });

      statusText.innerText = "Connected";
      roomIdText.innerText = "Room ID: " + callId;
    }

    // 3. Toggle Mute/Unmute Mic
    function toggleMic() {
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        if (audioTrack.enabled) {
          micBtn.classList.remove('off');
          micBtn.innerHTML = `<i class="fa-solid fa-microphone"></i>`;
        } else {
          micBtn.classList.add('off');
          micBtn.innerHTML = `<i class="fa-solid fa-microphone-slash"></i>`;
        }
      }
    }

    // 4. Toggle Video On/Off
    function toggleCam() {
      if (isAudioOnly) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        if (videoTrack.enabled) {
          camBtn.classList.remove('off');
          camBtn.innerHTML = `<i class="fa-solid fa-video"></i>`;
        } else {
          camBtn.classList.add('off');
          camBtn.innerHTML = `<i class="fa-solid fa-video-slash"></i>`;
        }
      }
    }

    // 5. End Call / Disconnect
    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      pc.close();
      window.location.reload(); // Refresh screen to reset state
    }
  </script>
</body>
</html>
