<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Calling & Chat App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone-screen {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 750px;
      background: #1a1a1a;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #333;
    }

    /* Auth Screen UI */
    .auth-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #121212;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 25px;
      gap: 15px;
    }
    .auth-container h2 { text-align: center; color: #28a745; margin-bottom: 10px; }
    .auth-container input {
      padding: 12px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }
    .auth-container button {
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .call-header {
      padding: 15px;
      text-align: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .user-info { font-size: 12px; color: #007bff; margin-bottom: 4px; }
    .call-status { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .room-display { font-size: 16px; font-weight: bold; color: #28a745; margin-top: 3px; }

    .video-viewport {
      flex: 1;
      position: relative;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 90px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #555;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 5;
    }

    .avatar-placeholder {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .avatar-placeholder i { font-size: 70px; color: #555; margin-bottom: 10px; }

    /* Chat Overlay */
    .chat-box {
      position: absolute;
      bottom: 100px;
      left: 10px;
      right: 10px;
      height: 180px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      padding: 10px;
      z-index: 15;
      border: 1px solid #333;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .msg { padding: 6px 10px; border-radius: 8px; max-width: 80%; word-break: break-word; }
    .msg.incoming { background: #333; align-self: flex-start; }
    .msg.outgoing { background: #007bff; align-self: flex-end; }
    
    .chat-input-area { display: flex; gap: 5px; }
    .chat-input-area input {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
    }
    .chat-input-area button {
      padding: 8px 12px;
      background: #007bff;
      border: none;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .setup-panel {
      position: absolute;
      bottom: 110px;
      left: 20px;
      right: 20px;
      background: rgba(25, 25, 25, 0.95);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      border: 1px solid #333;
    }

    .mode-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px; }
    .mode-btn {
      flex: 1; padding: 8px; font-size: 13px; background: #333; color: #ccc;
      border: 1px solid #444; border-radius: 8px; cursor: pointer;
    }
    .mode-btn.active { background: #007bff; color: #fff; border-color: #007bff; }

    input.main-input {
      padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff;
      border-radius: 8px; font-size: 15px; text-align: center;
    }

    .btn-action {
      padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 14px;
    }
    .btn-create { background: #28a745; }
    .btn-join { background: #17a2b8; }

    .controls-bar {
      height: 90px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-evenly; align-items: center; padding-bottom: 10px; z-index: 10;
    }

    .icon-btn {
      width: 50px; height: 50px; border-radius: 50%; border: none; background: #333; color: white;
      font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer;
    }
    .icon-btn.off { background: #dc3545; }
    .icon-btn.end-call { background: #dc3545; width: 60px; height: 60px; font-size: 22px; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <div class="phone-screen">
    
    <!-- Login Screen -->
    <div id="authScreen" class="auth-container">
      <h2><i class="fa-solid fa-user-lock"></i> Login / Register</h2>
      <input type="email" id="authEmail" placeholder="Enter Email">
      <input type="password" id="authPass" placeholder="Enter Password">
      <button onclick="handleAuth()">Continue</button>
    </div>

    <!-- Main App Screen -->
    <div class="call-header">
      <div id="userEmailText" class="user-info"></div>
      <div id="statusText" class="call-status">Ready to Call</div>
      <div id="roomIdText" class="room-display"></div>
    </div>

    <div class="video-viewport">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      
      <div id="avatarBox" class="avatar-placeholder">
        <i class="fa-solid fa-user-large"></i>
        <p>Voice Call</p>
      </div>

      <!-- Chat Box Overlay -->
      <div id="chatBox" class="chat-box">
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="msgInput" placeholder="Type a message...">
          <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <div id="setupPanel" class="setup-panel">
      <div class="mode-selector">
        <button id="videoModeBtn" class="mode-btn active" onclick="setCallMode('video')">
          <i class="fa-solid fa-video"></i> Video
        </button>
        <button id="audioModeBtn" class="mode-btn" onclick="setCallMode('audio')">
          <i class="fa-solid fa-phone"></i> Audio
        </button>
      </div>

      <button class="btn-action btn-create" onclick="createCall()">Start New Call</button>
      <input type="text" class="main-input" id="callInput" placeholder="Enter 10-Digit Room ID">
      <button class="btn-action btn-join" onclick="joinCall()">Join Call</button>
    </div>

    <div class="controls-bar">
      <button id="micBtn" class="icon-btn" onclick="toggleMic()" disabled>
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button id="chatToggleBtn" class="icon-btn" onclick="toggleChat()" disabled>
        <i class="fa-solid fa-comment-dots"></i>
      </button>
      <button id="endBtn" class="icon-btn end-call" onclick="endCall()" disabled>
        <i class="fa-solid fa-phone-slash"></i>
      </button>
      <button id="camBtn" class="icon-btn" onclick="toggleCam()" disabled>
        <i class="fa-solid fa-video"></i>
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCiIx-PaKqrZJnrNCy_AzRuAreEWHwAEsY",
      authDomain: "video-call-app-v2.firebaseapp.com",
      projectId: "video-call-app-v2",
      storageBucket: "video-call-app-v2.firebasestorage.app",
      messagingSenderId: "218235608788",
      appId: "1:218235608788:web:0c525518e73edce88be541",
      measurementId: "G-JHYXE20WRB"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const firestore = firebase.firestore();

    const servers = {
      iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }],
      iceCandidatePoolSize: 10,
    };

    let pc = new RTCPeerConnection(servers);
    let localStream = null;
    let remoteStream = null;
    let isAudioOnly = false;
    let activeCallDoc = null;
    let currentUser = null;

    // Login Handle Logic
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('userEmailText').innerText = "Logged in: " + user.email;
      } else {
        document.getElementById('authScreen').style.display = 'flex';
      }
    });

    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value.trim();
      if (!email || !pass) return alert("Please enter email and password!");

      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (e) {
        try {
          await auth.createUserWithEmailAndPassword(email, pass);
        } catch (err) {
          alert(err.message);
        }
      }
    }

    function setCallMode(mode) {
      if(mode === 'audio') {
        isAudioOnly = true;
        document.getElementById('audioModeBtn').classList.add('active');
        document.getElementById('videoModeBtn').classList.remove('active');
      } else {
        isAudioOnly = false;
        document.getElementById('videoModeBtn').classList.add('active');
        document.getElementById('audioModeBtn').classList.remove('active');
      }
    }

    async function initMedia() {
      const constraints = { audio: true, video: isAudioOnly ? false : true };
      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      remoteStream = new MediaStream();

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = event => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
      };

      if (!isAudioOnly) {
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('remoteVideo').srcObject = remoteStream;
      } else {
        document.getElementById('avatarBox').style.display = 'flex';
        document.getElementById('localVideo').style.display = 'none';
      }

      document.getElementById('micBtn').disabled = false;
      document.getElementById('camBtn').disabled = isAudioOnly;
      document.getElementById('endBtn').disabled = false;
      document.getElementById('chatToggleBtn').disabled = false;
    }

    // 10-Digit Random ID Call Creation
    async function createCall() {
      await initMedia();
      document.getElementById('setupPanel').style.display = 'none';
      document.getElementById('statusText').innerText = "Waiting for partner...";

      const random10DigitId = Math.floor(1000000000 + Math.random() * 9000000000).toString();
      activeCallDoc = firestore.collection('calls').doc(random10DigitId);
      
      const offerCandidates = activeCallDoc.collection('offerCandidates');
      const answerCandidates = activeCallDoc.collection('answerCandidates');

      document.getElementById('roomIdText').innerText = "Room ID: " + activeCallDoc.id;

      pc.onicecandidate = event => {
        event.candidate && offerCandidates.add(event.candidate.toJSON());
      };

      const offerDescription = await pc.createOffer();
      await pc.setLocalDescription(offerDescription);

      await activeCallDoc.set({ offer: { sdp: offerDescription.sdp, type: offerDescription.type } });

      activeCallDoc.onSnapshot(snapshot => {
        const data = snapshot.data();
        if (!pc.currentRemoteDescription && data?.answer) {
          pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          document.getElementById('statusText').innerText = "Connected";
        }
      });

      answerCandidates.onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') {
            pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });

      listenForMessages();
    }

    // Join Call
    async function joinCall() {
      const callId = document.getElementById('callInput').value.trim();
      if (!callId) return alert("Please enter 10-Digit Room ID");

      await initMedia();
      document.getElementById('setupPanel').style.display = 'none';
      document.getElementById('statusText').innerText = "Connecting...";

      activeCallDoc = firestore.collection('calls').doc(callId);
      const answerCandidates = activeCallDoc.collection('answerCandidates');
      const offerCandidates = activeCallDoc.collection('offerCandidates');

      pc.onicecandidate = event => {
        event.candidate && answerCandidates.add(event.candidate.toJSON());
      };

      const callData = (await activeCallDoc.get()).data();
      if (!callData) return alert("Invalid Room ID");

      await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answerDescription = await pc.createAnswer();
      await pc.setLocalDescription(answerDescription);

      await activeCallDoc.update({ answer: { type: answerDescription.type, sdp: answerDescription.sdp } });

      offerCandidates.onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') {
            pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });

      document.getElementById('statusText').innerText = "Connected";
      document.getElementById('roomIdText').innerText = "Room ID: " + callId;
      listenForMessages();
    }

    // Chat Logic
    function toggleChat() {
      const box = document.getElementById('chatBox');
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !activeCallDoc) return;

      await activeCallDoc.collection('chats').add({
        sender: currentUser.email,
        text: text,
        timestamp: Date.now()
      });

      input.value = '';
    }

    function listenForMessages() {
      activeCallDoc.collection('chats').orderBy('timestamp').onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') {
            const data = change.doc.data();
            const div = document.createElement('div');
            div.className = `msg ${data.sender === currentUser.email ? 'outgoing' : 'incoming'}`;
            div.innerText = data.text;
            const container = document.getElementById('chatMessages');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
          }
        });
      });
    }

    function toggleMic() {
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        const btn = document.getElementById('micBtn');
        btn.classList.toggle('off', !audioTrack.enabled);
        btn.innerHTML = audioTrack.enabled ? `<i class="fa-solid fa-microphone"></i>` : `<i class="fa-solid fa-microphone-slash"></i>`;
      }
    }

    function toggleCam() {
      if (isAudioOnly) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        const btn = document.getElementById('camBtn');
        btn.classList.toggle('off', !videoTrack.enabled);
        btn.innerHTML = videoTrack.enabled ? `<i class="fa-solid fa-video"></i>` : `<i class="fa-solid fa-video-slash"></i>`;
      }
    }

    function endCall() {
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      pc.close();
      window.location.reload();
    }
  </script>
</body>
</html>
