<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free WebRTC Video Call</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h2 { margin-bottom: 20px; }
    .video-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .video-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    video {
      width: 350px;
      height: 260px;
      background-color: #222;
      border-radius: 12px;
      border: 2px solid #333;
      object-fit: cover;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    input, button {
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    input { background: #2b2b2b; color: #fff; border: 1px solid #444; }
    button { background: #007bff; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
    .call-btn { background: #28a745; }
    .join-btn { background: #17a2b8; }
  </style>

  <!-- Firebase Web SDK (v8 Compatible Scripts) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <h2>Online Video Calling App</h2>

  <div class="video-container">
    <div class="video-box">
      <p>Your Video</p>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-box">
      <p>Remote User</p>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="controls">
    <button id="webcamBtn" onclick="startWebcam()">1. Camera On Karo</button>
    <button id="callBtn" class="call-btn" onclick="createCall()" disabled>2. Naya Call Start Karo (Create Room)</button>
    
    <hr style="width: 100%; border-color: #333; margin: 10px 0;">

    <input type="text" id="callInput" placeholder="Room ID Yahan Daalo">
    <button id="answerBtn" class="join-btn" onclick="joinCall()" disabled>3. Call Join Karo</button>
  </div>

  <script>
    // Aapki 100% Exact Config Keys:
    const firebaseConfig = {
      apiKey: "AIzaSyCiIx-PaKqrZJnrNCy_AzRuAreEWHwAEsY",
      authDomain: "video-call-app-v2.firebaseapp.com",
      projectId: "video-call-app-v2",
      storageBucket: "video-call-app-v2.firebasestorage.app",
      messagingSenderId: "218235608788",
      appId: "1:218235608788:web:0c525518e73edce88be541",
      measurementId: "G-JHYXE20WRB"
    };

    // Firebase Initialize
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const firestore = firebase.firestore();

    // Google STUN Server (Free)
    const servers = {
      iceServers: [
        { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
      ],
      iceCandidatePoolSize: 10,
    };

    let pc = new RTCPeerConnection(servers);
    let localStream = null;
    let remoteStream = null;

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const webcamBtn = document.getElementById('webcamBtn');
    const callBtn = document.getElementById('callBtn');
    const answerBtn = document.getElementById('answerBtn');
    const callInput = document.getElementById('callInput');

    // 1. Camera Start Karo
    async function startWebcam() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        remoteStream = new MediaStream();

        localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

        pc.ontrack = (event) => {
          event.streams[0].getTracks().forEach((track) => {
            remoteStream.addTrack(track);
          });
        };

        localVideo.srcObject = localStream;
        remoteVideo.srcObject = remoteStream;

        callBtn.disabled = false;
        answerBtn.disabled = false;
        webcamBtn.disabled = true;
      } catch (err) {
        alert("Camera and Microphone permission required!");
        console.error(err);
      }
    }

    // 2. Room Banayein (Caller)
    async function createCall() {
      const callDoc = firestore.collection('calls').doc();
      const offerCandidates = callDoc.collection('offerCandidates');
      const answerCandidates = callDoc.collection('answerCandidates');

      callInput.value = callDoc.id;

      pc.onicecandidate = (event) => {
        event.candidate && offerCandidates.add(event.candidate.toJSON());
      };

      const offerDescription = await pc.createOffer();
      await pc.setLocalDescription(offerDescription);

      const offer = {
        sdp: offerDescription.sdp,
        type: offerDescription.type,
      };

      await callDoc.set({ offer });

      callDoc.onSnapshot((snapshot) => {
        const data = snapshot.data();
        if (!pc.currentRemoteDescription && data?.answer) {
          const answerDescription = new RTCSessionDescription(data.answer);
          pc.setRemoteDescription(answerDescription);
        }
      });

      answerCandidates.onSnapshot((snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === 'added') {
            const candidate = new RTCIceCandidate(change.doc.data());
            pc.addIceCandidate(candidate);
          }
        });
      });

      alert("Room ID: " + callDoc.id + "\nIs Room ID ko join karne wale user ke paas bhejo!");
    }

    // 3. Call Join Karein (Receiver)
    async function joinCall() {
      const callId = callInput.value;
      if(!callId) return alert("Pehle Room ID daalo!");

      const callDoc = firestore.collection('calls').doc(callId);
      const answerCandidates = callDoc.collection('answerCandidates');
      const offerCandidates = callDoc.collection('offerCandidates');

      pc.onicecandidate = (event) => {
        event.candidate && answerCandidates.add(event.candidate.toJSON());
      };

      const callData = (await callDoc.get()).data();
      if (!callData) return alert("Galat Room ID!");

      const offerDescription = callData.offer;
      await pc.setRemoteDescription(new RTCSessionDescription(offerDescription));

      const answerDescription = await pc.createAnswer();
      await pc.setLocalDescription(answerDescription);

      const answer = {
        type: answerDescription.type,
        sdp: answerDescription.sdp,
      };

      await callDoc.update({ answer });

      offerCandidates.onSnapshot((snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === 'added') {
            let data = change.doc.data();
            pc.addIceCandidate(new RTCIceCandidate(data));
          }
        });
      });
    }
  </script>
</body>
</html>
